services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: virtuapet
      POSTGRES_USER: virtuapet
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtuapet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["virtuapet-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  virtuapet-postgres:

