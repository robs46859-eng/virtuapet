name: Publish API image

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "infra/migrations/**"
      - "scripts/migrate.mjs"
      - "scripts/bootstrap-postgres.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/virtuapet-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/virtuapet-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
