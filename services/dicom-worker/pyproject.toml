[project]
name = "virtuapet-dicom"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "pydicom>=3.0.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
